name: Deploy site to GitHub Pages

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run cancels a queued older one but never interrupts a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always publish the deploy branch, even if a manual run is started from another branch.
      - uses: actions/checkout@v4
        with:
          ref: deploy

      # Publish only the files the website needs (not AGENTS.md, README, scripts, workflows, etc.).
      - name: Assemble site
        run: |
          mkdir _site
          for item in index.html css js img data robots.txt sitemap.xml; do
            if [ -e "$item" ]; then cp -r "$item" _site/; fi
          done
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
