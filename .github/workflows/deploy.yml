name: Build and deploy site

# Builds the show and video data from the Google Sheets and publishes the site to GitHub Pages.
# Runs when:
#   - commits are pushed to the "deploy" branch
#   - on the hourly schedule below (GitHub only runs schedules from the default branch, so this file must also be on main)
#   - someone starts it from the Actions tab ("Run workflow") or the spreadsheet's "Rebuild website now" menu
#
# Publishing: the built site is committed as a single fresh commit to the "gh-pages" branch, and
# GitHub Pages serves that branch (Settings > Pages > Deploy from a branch). Each build gets a new
# commit, which avoids an actions/deploy-pages bug where redeploying an already-deployed commit
# reports success but keeps serving the old files (https://github.com/actions/deploy-pages/issues/383).
on:
  push:
    branches: [deploy]
  schedule:
    # 07:05 UTC = 00:05 Mountain Standard Time / 01:05 Mountain Daylight Time, just after Denver midnight.
    - cron: "5 7 * * *"
    # At 5 minutes past the hour, at 12:00 AM through 05:59 AM and 01:00 PM through 11:59 PM UTC (6a-11p MT)
    #- cron: "5 0-5,13-23 * * *"
    # Run every 5 minutes between 6 am and 11 pm mountain time
    #- cron: '*/5 6-22 * * *'
    #  timezone: 'America/Denver'
  workflow_dispatch:

# The push to gh-pages uses the PAGES_DEPLOY_TOKEN secret, not GITHUB_TOKEN, because GitHub Pages
# does not build commits pushed with GITHUB_TOKEN.
permissions:
  contents: read

# One deployment at a time; a newer run waits for a running deploy but never interrupts it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Always publish the deploy branch, even if the run was started from another branch.
      # The token is kept in the checkout's git config and used by the publish step's push.
      - uses: actions/checkout@v7
        with:
          ref: deploy
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}

      # Copy only the files the website needs (not the README, scripts, tests or workflows).
      # Any new top-level file the site uses (such as another icon) must be added to this list.
      # CNAME keeps the custom domain set when the gh-pages branch is replaced.
      - name: Assemble site
        run: |
          mkdir _site
          for item in index.html booking css js img data robots.txt sitemap.xml CNAME 404.html favicon.ico favicon-*.png apple-touch-icon.png android-chrome-*.png site.webmanifest; do
            if [ -e "$item" ]; then cp -r "$item" _site/; fi
          done
          # The site is already built, so tell GitHub Pages not to run Jekyll on it.
          touch _site/.nojekyll
          # The poster template and its design example are only inputs to the poster script.
          rm -f _site/img/blank-poster.webp _site/img/example_poster.png

      # If the sheet can't be downloaded or any row is invalid, this step fails and nothing is deployed,
      # so the live site keeps its last good data.
      - name: Generate schedule data from Google Sheets
        env:
          SCHEDULE_CSV_URL: ${{ vars.SCHEDULE_CSV_URL }}
        run: python3 scripts/process_schedule.py --output-dir _site/data --generate-events --site-root _site

      - name: Generate venue history
        run: python3 scripts/generate_venue_history.py --shows-file _site/data/past-shows.json --output _site/data/venue-history.json

      # Replaces the copied data/videos.json with the list from the video sheet, keeping its channel_url.
      # Fails the same way as the schedule step.
      - name: Generate video list from Google Sheets
        env:
          VIDEO_CSV_URL: ${{ vars.VIDEO_CSV_URL }}
        run: python3 scripts/process_videos.py --output-dir _site/data

      # Stamp the build time (UTC) into the footer of every page (home, booking and event pages), after the
      # event pages have been generated. The browser converts it to the visitor's local time.
      - name: Stamp build time
        run: |
          stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          find _site -name index.html -exec sed -i "s/__BUILD_TIME__/$stamp/" {} +

      # Scheduled runs only deploy when the new data differs from what is on the gh-pages branch.
      # Pushes and manual runs always deploy. The poster is built only from shows.json, so it needs
      # no comparison of its own.
      - name: Decide whether to deploy
        id: changed
        run: |
          deploy=true
          if [ "${{ github.event_name }}" = "schedule" ] && git fetch --quiet --depth=1 origin gh-pages; then
            deploy=false
            for file in data/shows.json data/past-shows.json data/venue-history.json data/videos.json; do
              if ! git show "FETCH_HEAD:$file" > live.tmp 2>/dev/null || ! cmp -s live.tmp "_site/$file"; then
                deploy=true
              fi
            done
            rm -f live.tmp
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Deploy: $deploy"

      # Everything below runs only when deploying, so scheduled runs with no data change skip the
      # install, tests and poster. Tests and poster generation run before publishing; a failure stops the deploy.
      - name: Install image generation dependency
        if: steps.changed.outputs.deploy == 'true'
        run: python3 -m pip install -r requirements.txt

      - name: Run tests
        if: steps.changed.outputs.deploy == 'true'
        run: python3 -m unittest discover tests -v

      - name: Generate upcoming show poster
        if: steps.changed.outputs.deploy == 'true'
        run: python3 scripts/generate_show_poster.py --shows-file _site/data/shows.json --output _site/img/upcomingshow.jpg --page-output _site/showposter

      # One poster per upcoming show (events/<slug>/poster.jpg), built from shows.json and the poster
      # template. The event pages already link to it.
      - name: Generate event posters
        if: steps.changed.outputs.deploy == 'true'
        run: python3 scripts/generate_event_posters.py --shows-file _site/data/shows.json --site-root _site
      # The booking page downloads: the one-page press kit PDF (with the past venues from past-shows.json)
      # and JPG copies of the band photos, written to booking/press/.
      - name: Generate press kit
        if: steps.changed.outputs.deploy == 'true'
        run: python3 scripts/generate_press_kit.py --site-root _site

      # Commits the contents of _site as a new commit with no parent and force-pushes it to gh-pages,
      # so the branch always holds exactly one commit: the current site. GitHub Pages then publishes it
      # (see the "pages build and deployment" runs in the Actions tab).
      - name: Publish to gh-pages branch
        if: steps.changed.outputs.deploy == 'true'
        working-directory: _site
        env:
          GIT_INDEX_FILE: ${{ runner.temp }}/gh-pages-index
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898283+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898283+github-actions[bot]@users.noreply.github.com
        run: |
          git --git-dir=../.git --work-tree=. add --all --force .
          tree=$(git --git-dir=../.git write-tree)
          commit=$(git --git-dir=../.git commit-tree "$tree" -m "Publish site from ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER}, ${{ github.event_name }})")
          git --git-dir=../.git push --force origin "$commit:refs/heads/gh-pages"
          echo "Pushed $commit to gh-pages"
