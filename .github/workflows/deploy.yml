name: Build and deploy site

# Builds the show and video data from the Google Sheets and publishes the site to GitHub Pages.
# Runs when:
#   - commits are pushed to the "deploy" branch
#   - every day (GitHub only runs schedules from the default branch, so this file must also be on main)
#   - someone starts it from the Actions tab ("Run workflow")
on:
  push:
    branches: [deploy]
  schedule:
    # 07:05 UTC = 00:05 Mountain Standard Time / 01:05 Mountain Daylight Time, just after Denver midnight.
    #- cron: "5 7 * * *"
    # Run every 5 minutes between 6 am and 11 pm mountain time
    - cron: '*/5 6-22 * * *'
      timezone: 'America/Denver'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run waits for a running deploy but never interrupts it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always publish the deploy branch, even if the run was started from another branch.
      - uses: actions/checkout@v7
        with:
          ref: deploy

      - name: Install image generation dependency
        run: python3 -m pip install -r requirements.txt

      - name: Run tests
        run: python3 -m unittest discover tests -v

      # Copy only the files the website needs (not the README, scripts, tests or workflows).
      # Any new top-level file the site uses (such as another icon) must be added to this list.
      - name: Assemble site
        run: |
          mkdir _site
          for item in index.html css js img data robots.txt sitemap.xml favicon.ico favicon-*.png apple-touch-icon.png android-chrome-*.png site.webmanifest; do
            if [ -e "$item" ]; then cp -r "$item" _site/; fi
          done

      # Stamp the build time (UTC) into the page. The browser converts it to the visitor's local time.
      - name: Stamp build time
        run: sed -i "s/__BUILD_TIME__/$(date -u +%Y-%m-%dT%H:%M:%SZ)/" _site/index.html
      # If the sheet can't be downloaded or any row is invalid, this step fails and nothing is deployed,
      # so the live site keeps its last good data.
      - name: Generate schedule data from Google Sheets
        env:
          SCHEDULE_CSV_URL: ${{ vars.SCHEDULE_CSV_URL }}
        run: python3 scripts/process_schedule.py --output-dir _site/data --generate-events --site-root _site

      - name: Generate upcoming show poster
        run: python3 scripts/generate_show_poster.py --shows-file _site/data/shows.json --output _site/img/upcomingshow.jpg --page-output _site/showposter

      # Replaces the copied data/videos.json with the list from the video sheet, keeping its channel_url.
      # Fails the same way as the schedule step.
      - name: Generate video list from Google Sheets
        env:
          VIDEO_CSV_URL: ${{ vars.VIDEO_CSV_URL }}
        run: python3 scripts/process_videos.py --output-dir _site/data

      - name: Generate event pages
        run: python3 scripts/event_pages.py --shows-file _site/data/shows.json --site-root _site

      - id: pages
        uses: actions/configure-pages@v6

      # Scheduled runs only deploy when the new data differs from what is live. Pushes and manual runs
      # always deploy.
      - name: Decide whether to deploy
        id: changed
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          deploy=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            deploy=false
            for file in data/shows.json data/past-shows.json data/videos.json img/upcomingshow.jpg; do
              if ! curl -fsSL --retry 2 "$BASE_URL/$file" -o "live-$(basename "$file")" || ! cmp -s "live-$(basename "$file")" "_site/$file"; then
                deploy=true
              fi
            done
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Deploy: $deploy"

      - uses: actions/upload-pages-artifact@v5
        if: steps.changed.outputs.deploy == 'true'
        with:
          path: _site

      - id: deployment
        if: steps.changed.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
